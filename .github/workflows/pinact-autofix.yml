name: Pin GitHub Actions

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: write       # criar commit
  pull-requests: write  # se for abrir PR

jobs:
  pinact:
    name: Pin & aged ≥ 7 days
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Pin actions (with 7-day cooldown)
        uses: suzuki-shunsuke/pinact-action@28aeb220eb3252ad0d4422dd5d9368e925acbd8d # v1.3.0
        with:
          verify: "true"
          min_age: "7"
          github_token: ${{ secrets.PINACT_TOKEN }}
