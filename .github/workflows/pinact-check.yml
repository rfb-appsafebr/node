name: Validate pinned actions

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  # Permite rodar manualmente também
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check actions are pinned
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Validate pinned actions
        uses: suzuki-shunsuke/pinact-action@28aeb220eb3252ad0d4422dd5d9368e925acbd8d # v1.3.0
        with:
          skip_push: "true"
